# Generated by sallyport. Update with `npx sallyport init --upgrade`.
name: sallyport

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful staging workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: sallyport-${{ github.repository }}
  cancel-in-progress: false

jobs:
  stage:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: zsumz/sallyport/.github/workflows/stage.yml@e0815302fa18bc3e91fbc26b0e15ebbe1bc95cac
    with:
      profile: strict
      signer_fingerprint: ${{ vars.SALLYPORT_SIGNER_FINGERPRINT }}

  finalize:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
    uses: zsumz/sallyport/.github/workflows/finalize.yml@e0815302fa18bc3e91fbc26b0e15ebbe1bc95cac
    with:
      candidate_run_id: ${{ inputs.candidate_run_id }}
      profile: strict
      signer_fingerprint: ${{ vars.SALLYPORT_SIGNER_FINGERPRINT }}
