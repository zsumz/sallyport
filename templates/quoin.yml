# Generated by quoin. Update with `npx quoin init --upgrade`.
name: quoin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful staging workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: quoin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  stage:
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: zsumz/quoin/.github/workflows/stage.yml@__QUOIN_SHA__
    with:
      profile: __QUOIN_PROFILE__
__QUOIN_SIGNER_FINGERPRINT__

  finalize:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
    uses: zsumz/quoin/.github/workflows/finalize.yml@__QUOIN_SHA__
    with:
      candidate_run_id: ${{ inputs.candidate_run_id }}
      profile: __QUOIN_PROFILE__
__QUOIN_SIGNER_FINGERPRINT__
